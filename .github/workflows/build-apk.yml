name: Build Chinese APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: |
          python3 -c "
          import re
          with open('pubspec.yaml', 'r') as f:
              content = f.read()
          content = re.sub(r'\ndev_dependencies:.*?(\n[a-z]|$)', r'\1', content, flags=re.DOTALL)
          with open('pubspec.yaml', 'w') as f:
              f.write(content)
          "
          echo "=== pubspec.yaml after cleanup ==="
          cat pubspec.yaml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: PocketLLMLite-Chinese
          path: build/app/outputs/flutter-apk/app-release.apk
